apiVersion: apps/v1
kind: Deployment
metadata:
  name: hedger
  labels: { app: hedger }
spec:
  replicas: 2
  selector:
    matchLabels: { app: hedger }
  template:
    metadata:
      labels: { app: hedger }
    spec:
      nodeSelector: { role: apps }
      containers:
        - name: hedger
          image: hedger-app:latest
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - name: USER_BACKEND
              value: http://user:8080
            - name: PRODUCT_BACKEND
              value: http://product:8080
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 250m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /healthcheck, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: { path: /healthcheck, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: hedger
  labels: { app: hedger }
spec:
  type: ClusterIP
  selector: { app: hedger }
  ports:
    - { name: http, port: 8080, targetPort: http }
