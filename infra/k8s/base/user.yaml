apiVersion: apps/v1
kind: Deployment
metadata:
  name: user
  labels: { app: user }
spec:
  replicas: 1
  selector:
    matchLabels: { app: user }
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels: { app: user }
    spec:
      nodeSelector: { role: apps } # apps 노드그룹(A)에 격리 — stress와 CPU 경합 차단
      terminationGracePeriodSeconds: 15
      containers:
        - name: user
          image: user-app:latest # overlay images: 로 ECR URL 주입
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: app-secret }
          resources:
            requests: { cpu: 512m, memory: 512Mi }
            limits: { cpu: 512m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /healthcheck, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: { path: /healthcheck, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: user
  labels: { app: user }
spec:
  type: ClusterIP
  selector: { app: user }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: user
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: user
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
