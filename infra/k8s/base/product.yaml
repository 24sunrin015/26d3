apiVersion: v1
kind: ServiceAccount
metadata:
  name: product-sa
  # eks.amazonaws.com/role-arn 주석은 overlay patch로 주입(IRSA → S3 권한)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product
  labels: { app: product }
spec:
  replicas: 1
  selector:
    matchLabels: { app: product }
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels: { app: product }
    spec:
      nodeSelector: { role: apps } # apps 노드그룹(A)에 격리
      serviceAccountName: product-sa
      terminationGracePeriodSeconds: 15
      containers:
        - name: product
          image: product-app:latest
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: app-secret }
          # ⚠️ product의 S3 버킷 env 키 이름은 제공 바이너리로 확정 필요(TROUBLESHOOTING).
          resources:
            requests: { cpu: 256m, memory: 768Mi }
            limits: { cpu: 512m, memory: 1Gi }
          readinessProbe:
            httpGet: { path: /healthcheck, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: { path: /healthcheck, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: product
  labels: { app: product }
spec:
  type: ClusterIP
  selector: { app: product }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: product
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: product
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
