apiVersion: v1
kind: ServiceAccount
metadata:
  name: product-sa
  # eks.amazonaws.com/role-arn 주석은 overlay patch로 주입(IRSA → S3 권한)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product
  labels: { app: product }
spec:
  replicas: 2
  selector:
    matchLabels: { app: product }
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels: { app: product }
    spec:
      serviceAccountName: product-sa
      terminationGracePeriodSeconds: 15
      containers:
        - name: product
          image: product-app:latest
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: app-secret }
          # ⚠️ product의 S3 버킷 env 키 이름은 제공 바이너리로 확정 필요(TROUBLESHOOTING).
          #    app-config에 S3_BUCKET/BUCKET_NAME/AWS_REGION을 모두 실어 커버.
          resources:
            requests: { cpu: 150m, memory: 192Mi }
            limits: { cpu: "1", memory: 512Mi }
          readinessProbe:
            httpGet: { path: /healthcheck, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: { path: /healthcheck, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: product
  labels: { app: product }
spec:
  type: ClusterIP
  selector: { app: product }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: product
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: product
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
