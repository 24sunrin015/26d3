apiVersion: apps/v1
kind: Deployment
metadata:
  name: stress
  labels: { app: stress }
spec:
  replicas: 1
  selector:
    matchLabels: { app: stress }
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels: { app: stress }
    spec:
      # stress 전용 노드(B)에 격리: taint toleration + nodeSelector.
      # requests 1500m으로 노드당 pod 1개만 스케줄 → 2번째는 Pending → CA가 노드 증설.
      nodeSelector: { role: stress }
      tolerations:
        - key: dedicated
          operator: Equal
          value: stress
          effect: NoSchedule
      terminationGracePeriodSeconds: 15
      containers:
        - name: stress
          image: stress-app:latest
          ports:
            - { name: http, containerPort: 8080 }
          # stress는 DB 미사용(요청 length로 부하 생성). 환경변수 불필요.
          resources:
            requests: { cpu: 1500m, memory: 128Mi }
            limits: { cpu: 2000m, memory: 256Mi } # 노드 2 vCPU 통째로 버스트
          readinessProbe:
            httpGet: { path: /healthcheck, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: { path: /healthcheck, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: stress
  labels: { app: stress }
spec:
  type: ClusterIP
  selector: { app: stress }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stress
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: stress
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        # 85% — stress는 CPU 거의 다 써도 SLO 안 깨짐(실측: 700k util 79.6%인데 perf 100%).
        # 70%면 조기 발화해 불필요 노드로 cost 낭비. 900k(util~101%, 붕괴임박) 전엔 발화(operation-strategy §6-4).
        target: { type: Utilization, averageUtilization: 85 }
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0 # CPU 급증 즉시 스케일(→ Pending → CA 노드 증설)
    scaleDown:
      stabilizationWindowSeconds: 120
